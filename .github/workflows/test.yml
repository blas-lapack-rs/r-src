name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  Crate-check:
    runs-on: ${{ matrix.config.os }}
    name: Crate-check ${{ matrix.config.os }} (${{ matrix.config.r }} - ${{ matrix.config.rust-version }})
    
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: 'release', rust-version: 'stable-msvc', rust-target: 'x86_64-pc-windows-gnu', rtools-version: '44'}
          - {os: windows-latest, r: 'devel',   rust-version: 'stable-msvc', rust-target: 'x86_64-pc-windows-gnu', rtools-version: '44'}
          - {os: macOS-latest,   r: 'release', rust-version: 'stable' }
          - {os: ubuntu-latest,  r: 'release', rust-version: 'stable' }
          - {os: ubuntu-latest,  r: 'devel',   rust-version: 'stable' }

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.config.rust-version }}
          targets: ${{ matrix.config.rust-target }}

      - uses: baptiste0928/cargo-install@v3
        if: matrix.config.r == 'release'
        with:
          crate: cargo-license

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          rtools-version: ${{ matrix.config.rtools-version }}
          use-public-rspm: true

      - name: Test crate
        run: |
          cargo test -vv
